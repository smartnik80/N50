<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Dark espresso surround – makes the parchment page frame pop */
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Phone frame ────────────────────────────────────────────────
       9:16 portrait ratio from viewport height, capped at 430 px.
       min-height: 100vh; content beyond that scrolls normally.
    ──────────────────────────────────────────────────────────────── */
    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
      gap: 0;
    }

    /* Thin warm-gray horizontal rules used as section dividers */
    .rule {
      border: none;
      border-top: 1px solid #c8bfb0;
      margin: 24px 0;
    }

    /* ── Photo placeholder ──────────────────────────────────────────
       Replace contents with an <img> or background-image.
    ──────────────────────────────────────────────────────────────── */
    .photo-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #d4ccbf;
      border: 1px solid #bdb5a8;
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #9a8c82;
    }

    .photo-placeholder svg {
      opacity: 0.45;
    }

    .photo-placeholder span {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ── Multiple-choice placeholder ────────────────────────────────
       Add or remove .choice elements freely.
       Replace each with a real answer button or label.
    ──────────────────────────────────────────────────────────────── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice {
      height: 54px;
      background: #f7f3ec;
      border: 1px solid #c8bfb0;
      border-left: 3px solid #8b1a1a;
      border-radius: 2px;
    }

    /* ── Navigation ─────────────────────────────────────────────────
       margin-top: auto pushes nav to the bottom of .page without any
       fixed or sticky positioning – the page scrolls naturally.
    ──────────────────────────────────────────────────────────────── */
    #nav {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 17px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      background: #8b1a1a;
      color: #faf7f2;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:not(:disabled):active {
      background: #6e1515;
    }

    /* Disabled: muted warm tone so it reads as unavailable, not broken */
    .btn:disabled {
      background: #c4b8ae;
      color: #9a8e86;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ── Photo placeholder ────────────────────────────────────── -->
    <div class="photo-placeholder">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Photo</span>
    </div>

    <hr class="rule">

    <!-- ── Multiple-choice placeholder ─────────────────────────── -->
    <!-- Add or remove .choice blocks as needed -->
    <div class="choices">
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
    </div>

    <hr class="rule">

    <!-- ── Navigation ───────────────────────────────────────────── -->
    <!-- All buttons hidden on load; JS reveals the correct ones. -->
    <nav id="nav">
      <!-- Shown only on start.html -->
      <button id="btn-start" class="btn" hidden>ВПЕРЕД</button>

      <!-- Shown on pageN.html; both start disabled until fetch confirms
           the target file exists -->
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    /* ── Navigation logic ──────────────────────────────────────────
       Reads the filename from the URL to decide which buttons to show.
       For numbered pages, uses fetch() HEAD to confirm neighbouring
       files exist before enabling the corresponding button.
       A 404 keeps the button disabled – no special-casing needed.

       Note: fetch() requires an HTTP server; file:// will always fail.
    ────────────────────────────────────────────────────────────── */
    (function () {
      const filename = location.pathname.split('/').pop() || '';

      const btnStart = document.getElementById('btn-start');
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');

      if (filename === 'start.html') {

        // ── start.html ────────────────────────────────────────────
        btnStart.hidden = false;
        btnStart.addEventListener('click', function () {
          location.href = 'page1.html';
        });

      } else {

        // ── pageN.html ────────────────────────────────────────────
        const match = filename.match(/^page(\d+)\.html$/);
        if (!match) return;

        const n        = parseInt(match[1], 10);
        const prevFile = 'page' + (n - 1) + '.html';
        const nextFile = 'page' + (n + 1) + '.html';

        btnBack.hidden = false;
        btnNext.hidden = false;

        // Enable btn and attach click only if file returns 200 OK.
        function enableIfExists(file, btn) {
          fetch(file, { method: 'HEAD' })
            .then(function (response) {
              if (response.ok) {
                btn.disabled = false;
                btn.addEventListener('click', function () {
                  location.href = file;
                });
              }
            })
            .catch(function () {});
        }

        enableIfExists(prevFile, btnBack);
        enableIfExists(nextFile, btnNext);

      }
    }());
  </script>
</body>
</html>
