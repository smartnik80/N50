<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 3</title>
  <link rel="stylesheet" href="buttons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
      overflow: hidden;
      position: relative;
    }

    /* Each wrapper bobs at a different phase */
    .stork-wrap {
      position: absolute;
      left: 0;
      width: 100%;
      pointer-events: none;
      animation: bob 2.2s ease-in-out infinite;
    }

    .stork-wrap:nth-child(1) { top: 25%; animation-delay:  0s;    }
    .stork-wrap:nth-child(2) { top: 43%; animation-delay: -0.7s;  }
    .stork-wrap:nth-child(3) { top: 61%; animation-delay: -1.4s;  }

    @keyframes bob {
      0%, 100% { transform: translateY(0);     }
      50%       { transform: translateY(-18px); }
    }

    .stork {
      position: absolute;
      width: 160px;
      height: auto;
    }

    /* Left-to-right flight */
    .ltr { animation: fly-ltr 7s linear infinite; }

    /* Right-to-left: mirror the image and reverse the path */
    .rtl {
      transform: scaleX(-1);
      animation: fly-rtl 7s linear infinite;
    }

    /* Stagger start positions ~2 s apart using negative delays */
    .stork-wrap:nth-child(1) .stork { animation-delay:  0s;  }
    .stork-wrap:nth-child(2) .stork { animation-delay: -2s;  }
    .stork-wrap:nth-child(3) .stork { animation-delay: -4s;  }

    @keyframes fly-ltr {
      from { left: -180px; }
      to   { left: calc(100% + 30px); }
    }

    @keyframes fly-rtl {
      from { left: calc(100% + 30px); }
      to   { left: -180px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="stork-wrap">
      <img class="stork ltr" src="assets/storck1.jpg" alt="">
    </div>
    <div class="stork-wrap">
      <img class="stork rtl" src="assets/storck2.jpg" alt="">
    </div>
    <div class="stork-wrap">
      <img class="stork ltr" src="assets/storck3.jpg" alt="">
    </div>

    <nav id="nav">
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename = location.pathname.split('/').pop() || '';
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');

      const match = filename.match(/^page(\d+)\.html$/);
      if (!match) return;

      const n        = parseInt(match[1], 10);
      const prevFile = 'page' + (n - 1) + '.html';
      const nextFile = 'page' + (n + 1) + '.html';

      btnBack.hidden = false;
      btnNext.hidden = false;

      function enableNav(file, btn) {
        fetch(file, { method: 'HEAD' })
          .then(function (r) {
            if (r.ok) {
              btn.disabled = false;
              btn.addEventListener('click', function () { location.href = file; });
            }
          })
          .catch(function () {});
      }

      enableNav(prevFile, btnBack);
      enableNav(nextFile, btnNext);
    }());
  </script>
</body>
</html>
