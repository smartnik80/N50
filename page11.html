<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 11</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .frame {
      border: 1px solid #c8bfb0;
      line-height: 0;
    }

    img {
      display: block;
      max-width: min(calc(100vh * 9 / 16), 430px, 100vw);
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="assets/mkl_facebook_full.jpg" alt="">
  </div>
</body>
</html>
