<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Roulette — N50</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #ede8df;
      color: #2a1a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 28px;
    }

    /* ── Roulette stage ──────────────────────────── */
    #roulette {
      position: relative;
      width: 360px;
      height: 360px;
      flex-shrink: 0;
    }

    /* Visual dial circle — transparent, same background as the page */
    #dial {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: transparent;
      border: 1.5px solid rgba(26,14,6,0.1);
    }

    /* Bottle pivot — zero-size anchor at dial centre, rotated by JS */
    #bottle-pivot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      z-index: 5;
    }

    /* Bottle SVG centred on the pivot point */
    #bottle-svg {
      position: absolute;
      width: 200px;
      height: 63px;
      left: -100px;
      top: -32px;
      overflow: visible;
      filter: drop-shadow(0 3px 10px rgba(26,14,6,0.28));
    }

    /* ── Face chips ──────────────────────────────── */
    .face-chip {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(26,14,6,0.28);
      transform: translate(-50%, -50%);
      transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      background: #ccc4b8;
      z-index: 2;
      cursor: default;
    }

    .face-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .face-chip.highlight {
      border-color: #f5c842;
      box-shadow: 0 0 20px rgba(245,200,66,0.9), 0 0 6px rgba(245,200,66,0.5);
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 10;
    }

    /* ── Controls ────────────────────────────────── */
    #spin-btn {
      padding: 14px 52px;
      background: #8b1a1a;
      color: #faf7f2;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }

    #spin-btn:active:not(:disabled) {
      background: #6e1515;
      transform: scale(0.97);
    }

    #spin-btn:disabled { opacity: 0.35; cursor: default; }

    #status {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #9a8e86;
      min-height: 15px;
      text-align: center;
    }

    /* ── Winner overlay ──────────────────────────── */
    #winner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(14,7,2,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      padding: 24px;
    }

    #winner-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #winner-video {
      width: min(90vw, 90dvh * 16 / 9, 560px);
      max-height: 70dvh;
      border-radius: 6px;
      background: #000;
      display: block;
    }

    #back-btn {
      padding: 10px 36px;
      background: transparent;
      color: rgba(237,232,223,0.6);
      border: 1px solid rgba(237,232,223,0.2);
      border-radius: 24px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.16em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    #back-btn:active {
      color: rgba(237,232,223,0.9);
      border-color: rgba(237,232,223,0.45);
    }
  </style>
</head>
<body>

  <div id="roulette">
    <div id="dial"></div>

    <div id="bottle-pivot">
      <!--
        Wine bottle lying on its side, neck pointing right (+x).
        ViewBox "-82 -26 164 52": bottle spans x≈-80..+74, y≈-20..+20,
        centred near the origin so the pivot coincides with the bottle's midpoint.
      -->
      <svg id="bottle-svg" viewBox="-82 -26 164 52" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#6cb860"/>
            <stop offset="30%"  stop-color="#2e6228"/>
            <stop offset="70%"  stop-color="#296024"/>
            <stop offset="100%" stop-color="#183e13"/>
          </linearGradient>
          <linearGradient id="g-foil" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#c02828"/>
            <stop offset="100%" stop-color="#580e0e"/>
          </linearGradient>
          <linearGradient id="g-label" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#dabb6c"/>
            <stop offset="100%" stop-color="#9a7422"/>
          </linearGradient>
        </defs>

        <!-- Glass body: rounded bottom (left), tapered shoulder, neck.
             Path is perfectly symmetric about y=0. -->
        <path fill="url(#g-glass)" stroke="#14280f" stroke-width="1.3"
              stroke-linejoin="round"
          d="M -60,-20
             L 2,-20
             C 16,-20 26,-10 30,-10
             L 62,-10
             L 62,10
             L 30,10
             C 26,10 16,20 2,20
             L -60,20
             Z"/>

        <!-- Foil capsule — overlaps last bit of neck + extends past the glass tip.
             Slightly taller than the neck (±12 vs ±10) to show the capsule ridge. -->
        <rect x="54" y="-12" width="20" height="24" rx="1.5"
              fill="url(#g-foil)" stroke="#3a0808" stroke-width="0.9"/>
        <!-- Foil highlight band at the top -->
        <rect x="54" y="-12" width="20" height="5" rx="1.5"
              fill="rgba(255,255,255,0.14)"/>
        <!-- Foil lower crease line -->
        <line x1="54" y1="4" x2="74" y2="4"
              stroke="rgba(0,0,0,0.25)" stroke-width="0.8"/>

        <!-- Label on body -->
        <rect x="-50" y="-13" width="42" height="26" rx="3.5"
              fill="url(#g-label)"/>

        <!-- Specular highlight — curved streak along top of body -->
        <path d="M -55,-17 L -4,-17 C 8,-17 17,-11 19,-10"
              fill="none" stroke="rgba(255,255,255,0.3)"
              stroke-width="2.5" stroke-linecap="round"/>

        <!-- Secondary softer highlight lower on body -->
        <path d="M -55,-13 L -8,-13 C 2,-13 9,-11 11,-10"
              fill="none" stroke="rgba(255,255,255,0.1)"
              stroke-width="1.5" stroke-linecap="round"/>

        <!-- Neck specular -->
        <line x1="32" y1="-7.5" x2="52" y2="-7.5"
              stroke="rgba(255,255,255,0.13)" stroke-width="1.2" stroke-linecap="round"/>

        <!-- Shoulder crease line (where glass body meets shoulder) -->
        <line x1="2" y1="-20" x2="2" y2="20"
              stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>
      </svg>
    </div>
  </div>

  <div id="status"></div>
  <button id="spin-btn" disabled>Крутить</button>

  <!-- ── Winner overlay: video only ───────────────── -->
  <div id="winner-overlay">
    <video id="winner-video" playsinline webkit-playsinline></video>
    <button id="back-btn">назад</button>
  </div>

  <script>
    // Neck points RIGHT (+x). Face at angle θ° sits at bearing θ° clockwise from right.
    // Rotating the bottle by θ° aims the neck at that face.

    const DIAL_CENTER = 180;
    const FACE_RADIUS = 142;
    const SPIN_MS     = 15000;
    const ROTS_MIN    = 8;
    const ROTS_MAX    = 13;

    let guests        = [];
    let eliminated    = new Set();
    let pickIndex     = 0;   // next guest to pick, by manifest order
    let currentAngle  = 0;
    let spinning      = false;
    let pendingWinner = null;

    const bottlePivot = document.getElementById('bottle-pivot');
    const roulette    = document.getElementById('roulette');
    const spinBtn     = document.getElementById('spin-btn');
    const statusEl    = document.getElementById('status');
    const overlay     = document.getElementById('winner-overlay');
    const winnerVideo = document.getElementById('winner-video');
    const backBtn     = document.getElementById('back-btn');

    function rng() {
      const a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] / 0x100000000;
    }

    function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }

    // ── Init ──────────────────────────────────────────
    async function init() {
      try {
        const manifest = await fetch('assets/circles/manifest.json').then(r => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        });
        guests = manifest.videos.map(v => ({
          name: v.replace(/\.[^.]+$/, ''),
          videoFile: v,
          angle: 0,
          el: null,
        }));
        if (!guests.length) { setStatus('Нет гостей'); return; }
        renderDial();
      } catch (e) {
        setStatus('Ошибка загрузки');
        console.error('manifest error:', e);
      }
    }

    function setStatus(msg) { statusEl.textContent = msg; }
    function getActive() { return guests.filter(g => !eliminated.has(g.name)); }
    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    // ── Dial ──────────────────────────────────────────
    function renderDial() {
      roulette.querySelectorAll('.face-chip').forEach(el => el.remove());

      const active = getActive();
      if (!active.length) {
        setStatus('Все гости сыграли. Начинаем заново...');
        spinBtn.disabled = true;
        setTimeout(() => {
          eliminated.clear();
          pickIndex = 0;
          setStatus('');
          currentAngle = 0;
          bottlePivot.style.transform = 'rotate(0deg)';
          renderDial();
        }, 2500);
        return;
      }

      const N = active.length;
      active.forEach((g, i) => {
        const deg = (i / N) * 360;
        g.angle = deg;
        const rad = deg * (Math.PI / 180);

        const chip = document.createElement('div');
        chip.className = 'face-chip';
        chip.style.left = (DIAL_CENTER + FACE_RADIUS * Math.cos(rad)) + 'px';
        chip.style.top  = (DIAL_CENTER + FACE_RADIUS * Math.sin(rad)) + 'px';
        chip.dataset.name = g.name;

        const img = document.createElement('img');
        img.src = `assets/guests/${g.name}.jpg`;
        img.alt = capitalize(g.name);
        chip.appendChild(img);

        roulette.appendChild(chip);
        g.el = chip;
      });

      spinBtn.disabled = false;
      setStatus('');
    }

    // ── Spin ──────────────────────────────────────────
    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      const active = getActive();
      if (!active.length) return;

      const winner = guests[pickIndex % guests.length];
      pickIndex++;

      // Preload the video immediately, while the bottle is still spinning.
      // On iOS, calling play()+pause() inside the gesture handler unlocks
      // autoplay for the subsequent play() call after the spin finishes.
      winnerVideo.src = `assets/circles/${winner.videoFile}`;
      winnerVideo.preload = 'auto';
      const primePlay = winnerVideo.play();
      if (primePlay) primePlay.then(() => { winnerVideo.pause(); winnerVideo.currentTime = 0; }).catch(() => {});

      spinning = true;
      spinBtn.disabled = true;
      setStatus('');

      const norm  = ((currentAngle % 360) + 360) % 360;
      let delta   = winner.angle - norm;
      if (delta <= 0) delta += 360;

      const extraRots  = ROTS_MIN + Math.floor(rng() * (ROTS_MAX - ROTS_MIN + 1));
      const totalDelta = extraRots * 360 + delta;
      const startAngle = currentAngle;
      const startTime  = performance.now();

      function frame(now) {
        const t     = Math.min((now - startTime) / SPIN_MS, 1);
        const angle = startAngle + totalDelta * easeOutQuint(t);
        currentAngle = angle;
        bottlePivot.style.transform = `rotate(${angle}deg)`;

        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          currentAngle = startAngle + totalDelta;
          bottlePivot.style.transform = `rotate(${currentAngle}deg)`;
          spinning = false;
          onSpinEnd(winner);
        }
      }

      requestAnimationFrame(frame);
    });

    // ── Post-spin ─────────────────────────────────────
    function onSpinEnd(winner) {
      if (winner.el) winner.el.classList.add('highlight');
      setTimeout(() => showOverlay(winner), 1200);
    }

    function showOverlay(winner) {
      pendingWinner = winner;
      overlay.classList.add('visible');
      // Video is already preloaded; currentTime was reset to 0
      winnerVideo.play().catch(() => {});
    }

    winnerVideo.addEventListener('ended', closeOverlay);
    backBtn.addEventListener('click', closeOverlay);

    function closeOverlay() {
      if (!pendingWinner) return;
      const winner  = pendingWinner;
      pendingWinner = null;

      overlay.classList.remove('visible');
      winnerVideo.pause();

      setTimeout(() => {
        winnerVideo.src = '';
        if (winner.el) winner.el.classList.remove('highlight');
        eliminated.add(winner.name);
        renderDial();
      }, 450);
    }

    init();
  </script>

</body>
</html>
