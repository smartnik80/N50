<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Guess Who</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #1a0e06;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Photo section ─────────────────────────── */
    #photo-section {
      flex: 1;
      min-height: 0;
      background: #100800;
    }

    #photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.5s ease;
    }

    #photo-img.fade { opacity: 0; }

    /* ── Belt section ──────────────────────────── */
    #belt-section {
      height: 136px;
      background: #1f1208;
      position: relative;
      overflow: hidden;
      cursor: grab;
      flex-shrink: 0;
      border-top: 1px solid #2e1a08;
      border-bottom: 1px solid #2e1a08;
    }

    #belt-section:active { cursor: grabbing; }

    /* Face stickers */
    .face {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 90px;
      height: 90px;
      border-radius: 11px;
      overflow: hidden;
      will-change: left;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    @keyframes wobble {
      0%   { transform: translateY(-50%) scale(1)    rotate(0deg); }
      10%  { transform: translateY(-50%) scale(1.22) rotate(-10deg); }
      22%  { transform: translateY(-50%) scale(1.22) rotate(10deg); }
      34%  { transform: translateY(-50%) scale(1.17) rotate(-7deg); }
      46%  { transform: translateY(-50%) scale(1.17) rotate(7deg); }
      58%  { transform: translateY(-50%) scale(1.12) rotate(-4deg); }
      70%  { transform: translateY(-50%) scale(1.12) rotate(4deg); }
      84%  { transform: translateY(-50%) scale(1.06) rotate(-1deg); }
      100% { transform: translateY(-50%) scale(1)    rotate(0deg); }
    }

    .face.wobble {
      animation: wobble 0.85s cubic-bezier(.36,.07,.19,.97) both;
      z-index: 15;
    }

    @keyframes zoom-out {
      0%   { transform: translateY(-50%) scale(1);   opacity: 1; }
      60%  { transform: translateY(-50%) scale(0.3); opacity: 0.5; }
      100% { transform: translateY(-50%) scale(0);   opacity: 0; }
    }

    .face.removing {
      animation: zoom-out 0.38s ease-in forwards;
      z-index: 15;
      pointer-events: none;
    }

    /* ── Navigation ────────────────────────────── */
    #nav {
      height: 50px;
      background: #120a02;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-arrow {
      flex: 1;
      height: 36px;
      background: #2a1508;
      border: none;
      border-radius: 6px;
      color: #c8a882;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      outline: none;
    }

    .nav-arrow:not(:disabled):active { background: #3e200c; color: #fff; }
    .nav-arrow:disabled { opacity: 0.2; cursor: default; }

    #counter {
      font-size: 12px;
      color: #5a3a1e;
      min-width: 52px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="photo-section">
  <img id="photo-img" alt="">
</div>

<div id="belt-section"></div>

<nav id="nav">
  <button class="nav-arrow" id="btn-prev">&#8592;</button>
  <span id="counter"></span>
  <button class="nav-arrow" id="btn-next">&#8594;</button>
</nav>

<script>
const PHOTO_BASE = 'assets/guesswho/';
const GUEST_BASE = 'assets/guests/';

const PHOTOS = [
  'baigouzov_ivanov_kolosov',
  'brilev_koksharov',
  'brilev_koryakin',
  'dikov_tamuza_esinevich',
  'inkin_kolosov_ivanov_kuzmin',
  'ivanov_bavin',
  'ivanov_dikov',
  'ivanov_ivanova_kolosova',
  'ivanov_marinin',
  'ivanova_kuzina',
  'koksharov',
  'koksharov_kolosov_ivanov_sukhotsky',
  'kolosov_esinevich',
  'kuzina_ivanova',
  'kuznetsov_esinevich_kolosov',
  'skorodumov_ogay_kuznetsov',
  'sukhotsky_esinevich_ivanov_kolosov_kuznetsov_ogay',
];

const ALL_GUESTS = [
  'baigouzov','bavin','brilev','chernishova','dikov',
  'esinevich','feshin','inkin','ivanov','ivanova',
  'koksharov','kolosov','kolosova','koryakin','kuzina','kuzmin',
  'kuznetsov','marinin','ogay','platon','sharipov',
  'skorodumov','sukhotsky','tamuza','tamuzs',
];

const FACE_W = 90;
const GAP = 16;
const STRIDE = FACE_W + GAP;
const BASE_SPEED = 0.55;
const MAX_SPEED = 8;

// ─── State ───────────────────────────────────────
let photoIdx = 0;
let targetNames = [];
let foundNames = new Set();
let removedGuests = new Set();
let photoRevealed = false;

// Belt
let positions = [];  // [{name, x}]
let faceElMap = {};  // name → element
let speed = BASE_SPEED;
let beltWidth = 0;

// Drag tracking
let dragActive = false;
let dragStartX = 0;
let dragLastX = 0;
let dragLastTime = 0;
let dragVelocity = 0; // px/ms
let didDrag = false;

// ─── Boot ────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  beltWidth = document.getElementById('belt-section').offsetWidth || window.innerWidth;
  loadPhoto(0);
  buildBelt();
  startLoop();
  bindEvents();
  updateNav();
});

window.addEventListener('resize', () => {
  beltWidth = document.getElementById('belt-section').offsetWidth || window.innerWidth;
});

// ─── Photo ───────────────────────────────────────
function loadPhoto(idx) {
  photoIdx = idx;
  const base = PHOTOS[idx];
  targetNames = base.split('_');
  foundNames.clear();
  photoRevealed = false;

  const img = document.getElementById('photo-img');
  img.classList.add('fade');
  setTimeout(() => {
    img.src = PHOTO_BASE + base + '01.jpg';
    img.classList.remove('fade');
  }, 280);

  document.getElementById('counter').textContent = `${idx + 1} / ${PHOTOS.length}`;
}

function revealPhoto() {
  const img = document.getElementById('photo-img');
  img.classList.add('fade');
  setTimeout(() => {
    img.src = PHOTO_BASE + PHOTOS[photoIdx] + '02.jpg';
    img.classList.remove('fade');
  }, 380);
}

// ─── Belt ────────────────────────────────────────
function buildBelt() {
  Object.values(faceElMap).forEach(el => el.remove());
  faceElMap = {};
  positions = [];

  const belt = document.getElementById('belt-section');
  const active = ALL_GUESTS.filter(g => !removedGuests.has(g));
  if (!active.length) return;

  active.forEach((name, i) => {
    const el = document.createElement('div');
    el.className = 'face';
    el.dataset.name = name;
    const img = document.createElement('img');
    img.src = GUEST_BASE + name + '.jpg';
    el.appendChild(img);
    belt.appendChild(el);
    faceElMap[name] = el;
    positions.push({ name, x: i * STRIDE });
  });
}

function stepBelt() {
  const n = positions.length;
  if (!n) return;
  const loopWidth = n * STRIDE;

  positions.forEach(p => {
    p.x += speed;
    if (p.x > beltWidth + FACE_W + GAP) p.x -= loopWidth;
    if (p.x < -FACE_W - GAP) p.x += loopWidth;
    const el = faceElMap[p.name];
    if (el) el.style.left = p.x + 'px';
  });
}

function startLoop() {
  (function loop() {
    stepBelt();
    // Slowly ease back toward base speed when not dragging
    if (!dragActive) {
      speed += (BASE_SPEED - speed) * 0.006;
    }
    requestAnimationFrame(loop);
  })();
}

// ─── Identification ──────────────────────────────
function identifyFace(name) {
  if (!name) return;
  if (foundNames.has(name)) return;
  const el = faceElMap[name];
  if (!el || el.classList.contains('removing') || el.classList.contains('wobble')) return;

  if (targetNames.includes(name)) {
    foundNames.add(name);
    el.classList.add('wobble');
    el.addEventListener('animationend', () => el.classList.remove('wobble'), { once: true });

    const allFound = targetNames.every(n => foundNames.has(n));
    if (allFound && !photoRevealed) {
      photoRevealed = true;
      setTimeout(revealPhoto, 700);
    }
  } else {
    removedGuests.add(name);
    el.classList.add('removing');
    const gone = name;
    setTimeout(() => {
      const e = faceElMap[gone];
      if (e) e.remove();
      delete faceElMap[gone];
      positions = positions.filter(p => p.name !== gone);
    }, 420);
  }
}

function tapAt(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  const face = el?.closest?.('.face') || (el?.classList?.contains('face') ? el : null);
  if (face) identifyFace(face.dataset.name);
}

// ─── Drag helpers ────────────────────────────────
function onDragStart(x) {
  dragActive = true;
  dragStartX = x;
  dragLastX = x;
  dragLastTime = performance.now();
  dragVelocity = 0;
  didDrag = false;
}

function onDragMove(x) {
  const now = performance.now();
  const dt = Math.max(now - dragLastTime, 1);
  const dx = x - dragLastX;
  dragVelocity = dx / dt; // px/ms
  dragLastX = x;
  dragLastTime = now;
  if (Math.abs(x - dragStartX) > 6) didDrag = true;
  // Direct speed control: dx per event mapped to speed change
  speed += dx * 0.18;
  speed = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, speed));
}

function onDragEnd(clientX, clientY) {
  dragActive = false;
  if (!didDrag) {
    tapAt(clientX, clientY);
  } else {
    // Apply final flick momentum
    const flick = dragVelocity * 50;
    speed = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, speed + flick));
  }
}

// ─── Events ──────────────────────────────────────
function bindEvents() {
  const belt = document.getElementById('belt-section');

  // Touch
  belt.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    onDragStart(t.clientX);
  }, { passive: false });

  belt.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onDragMove(t.clientX);
  }, { passive: false });

  belt.addEventListener('touchend', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onDragEnd(t.clientX, t.clientY);
  }, { passive: false });

  // Mouse
  belt.addEventListener('mousedown', e => {
    onDragStart(e.clientX);
  });

  window.addEventListener('mousemove', e => {
    if (!dragActive) return;
    onDragMove(e.clientX);
  });

  window.addEventListener('mouseup', e => {
    if (!dragActive) return;
    onDragEnd(e.clientX, e.clientY);
  });

  // Nav
  document.getElementById('btn-prev').addEventListener('click', () => goTo(photoIdx - 1));
  document.getElementById('btn-next').addEventListener('click', () => goTo(photoIdx + 1));
}

// ─── Navigation ──────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= PHOTOS.length) return;
  removedGuests.clear();
  buildBelt();
  loadPhoto(idx);
  updateNav();
}

function updateNav() {
  document.getElementById('btn-prev').disabled = photoIdx === 0;
  document.getElementById('btn-next').disabled = photoIdx === PHOTOS.length - 1;
}
</script>
</body>
</html>
