<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N50</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .card {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 32px;
      gap: 16px;
    }

    .headline-photo {
      width: 100%;
      display: block;
    }

    a.item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: #8b1a1a;
      color: #faf7f2;
      text-decoration: none;
      border-radius: 2px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    a.item:active { background: #6e1515; }

    a.item span.arrow {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="headline-photo" src="assets/glava-L.jpg" alt="">
    <a class="item" href="rolodex.html">
      Кто здесь <span class="arrow">&#8594;</span>
    </a>
    <a class="item" href="page1.html">
      Викторина <span class="arrow">&#8594;</span>
    </a>
    <a class="item" href="guesswho.html">
      Угадай кто <span class="arrow">&#8594;</span>
    </a>
    <a class="item" href="gallery.html">
      Галерея <span class="arrow">&#8594;</span>
    </a>
    <a class="item" href="menu.html">
      Меню <span class="arrow">&#8594;</span>
    </a>
  </div>
</body>
</html>
