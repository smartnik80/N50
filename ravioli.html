<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню — Ravioli</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      color: #2c1a0e;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 17px;
      line-height: 1.55;
      padding: 0 0 40px;
    }

    header {
      background: #2c1a0e;
      color: #f5f0e8;
      text-align: center;
      padding: 28px 20px 22px;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.7;
      letter-spacing: 0.08em;
    }

    .section {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .section-title {
      margin-top: 36px;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8b5e3c;
      border-bottom: 1px solid #c9b49a;
      padding-bottom: 8px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e0d5c4;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      margin-top: 2px;
      border: 2px solid #8b5e3c;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    .item input[type="checkbox"]:checked {
      background: #8b5e3c;
      border-color: #6b4428;
    }

    .item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 9px;
      height: 15px;
      border: 3px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(42deg);
    }

    .item-text {
      flex: 1;
    }

    .item-name {
      font-size: 1rem;
      font-weight: bold;
      color: #2c1a0e;
    }

    .item-name-tr {
      font-weight: normal;
      color: #7a5c40;
      font-size: 0.93rem;
    }

    .item-desc {
      display: block;
      margin-top: 3px;
      font-style: italic;
      font-size: 0.88rem;
      color: #5a4030;
      line-height: 1.45;
    }

    .footer-form {
      max-width: 680px;
      margin: 44px auto 0;
      padding: 28px 16px 10px;
      border-top: 2px solid #c9b49a;
    }

    .footer-form label {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8b5e3c;
      margin-bottom: 8px;
    }

    .footer-form input[type="text"] {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: Georgia, serif;
      border: 2px solid #c9b49a;
      border-radius: 6px;
      background: #fff;
      color: #2c1a0e;
      outline: none;
      transition: border-color 0.15s;
    }

    .footer-form input[type="text"]:focus {
      border-color: #8b5e3c;
    }

    .footer-form button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      background: #2c1a0e;
      color: #f5f0e8;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .footer-form button:hover:not(:disabled),
    .footer-form button:active:not(:disabled) {
      background: #8b5e3c;
    }

    .footer-form button:disabled {
      background: #c9b49a;
      color: #f5f0e8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<header>
  <h1>Ravioli</h1>
  <p>Гёреме — Обед 15 мая</p>
</header>

<div id="menu-root" class="section"></div>

<div class="footer-form section">
  <label for="guest-name">ИМЯ</label>
  <input type="text" id="guest-name" name="guest-name" autocomplete="given-name">
  <button type="button" id="submit-btn" disabled>ОТПРАВИТЬ</button>
  <p id="form-err" style="display:none;margin-top:14px;text-align:center;font-family:Arial,sans-serif;font-size:0.9rem;color:#8b2020;"></p>
</div>

<script>
// ─── MENU DATA ───────────────────────────────────────────────────────────────
var MENU = [
  {
    section_ru: 'Закуски',
    items: [
      { ru: 'Суп дня',                        tr: 'Günün Çorbası' },
      { ru: 'Пастуший салат',                  tr: 'Çoban Salatası',          desc: 'Лук, помидоры, огурцы, петрушка, зелёный перец, оливковое масло, гранатовая патока' },
      { ru: 'Садовый салат',                   tr: 'Bahçe Salatası',          desc: 'Сезонная зелень, помидоры, огурцы, кукуруза, краснокочанная капуста' },
      { ru: 'Салат с грецким орехом',          tr: 'Gavurdağı Salatası',      desc: 'Помидоры, перец, огурцы, петрушка, лук, грецкий орех' },
      { ru: 'Ичли кёфте',                      tr: 'İçli Köfte',              desc: 'Жареные котлеты в оболочке из дроблёной пшеницы с мясной начинкой' },
      { ru: 'Охотничий пирог',                 tr: 'Avcı Böreği',             desc: 'Слоёный пирог с морковью, грибами, кабачком, луком, перцем, капустой, картофелем и сыром' },
      { ru: 'Сигара-бурек',                    tr: 'Sigara Böreği',           desc: 'Тонкое тесто с сырно-яичной начинкой, свёрнутое в трубочку и обжаренное' },
      { ru: 'Фалафель',                        tr: 'Falafel',                 desc: 'Жареные шарики из нута с луком, чесноком и специями' },
      { ru: 'Долма из виноградных листьев',    tr: 'Yaprak Sarma',            desc: 'Виноградные листья с рисовой начинкой и луком; йогурт и томатный соус' },
      { ru: 'Шакшука',                         tr: 'Şakşuka',                 desc: 'Обжаренные баклажаны и перец в томатном соусе с чесноком и йогуртом' },
      { ru: 'Котлеты из чечевицы',             tr: 'Mercimek Köftesi',        desc: 'Холодные котлеты из красной чечевицы и дроблёной пшеницы с петрушкой и томатной пастой' }
    ]
  },
  {
    section_ru: 'Манты и пельмени',
    items: [
      { ru: 'Манты',   tr: 'Mantı',   desc: 'Домашние пельмени с говяжьим фаршем и луком; чесночный йогурт, томатное масло с мятой и сумахом' },
      { ru: 'Пераву',  tr: 'Peravu',  desc: 'Традиционные пельмени из шпинатного теста с начинкой из солёного сыра и яйца; томатное масло и красный перец' }
    ]
  },
  {
    section_ru: 'Десерты',
    items: [
      { ru: 'Тыквенный десерт',  tr: 'Kabak Tatlısı',   desc: 'Засахаренная тыква с тахини и грецким орехом' },
      { ru: 'Десерт из кураги',  tr: 'Kayısı Tatlısı',  desc: 'Засахаренная курага с тахини и грецким орехом' }
    ]
  },
  {
    section_ru: 'Напитки',
    items: [
      { ru: 'Капучино',                    tr: 'Cappuccino' },
      { ru: 'Американо',                   tr: 'Americano' },
      { ru: 'Эспрессо',                    tr: 'Espresso' },
      { ru: 'Растворимый кофе',            tr: 'Nescafe' },
      { ru: 'Латте',                       tr: 'Latte' },
      { ru: 'Мокко',                       tr: 'Mocha' },
      { ru: 'Горячий шоколад',             tr: 'Sıcak Çikolata' },
      { ru: 'Турецкий кофе',               tr: 'Türk Kahvesi' },
      { ru: 'Травяной чай',                tr: 'Bitki Çayı' },
      { ru: 'Газированные напитки',        tr: 'Meşrubat',             desc: 'Кола, Фанта, Спрайт, Ice-Tea (манго, арбуз, персик, лимон, дыня-клубника)' },
      { ru: 'Минеральная вода / Айран',    tr: 'Maden Suyu / Ayran',   desc: 'Айран — холодный солёный йогуртовый напиток' },
      { ru: 'San Pellegrino 250 мл',       tr: 'San Pellegrino 250ml' },
      { ru: 'San Pellegrino 750 мл',       tr: 'San Pellegrino 750ml' },
      { ru: 'Свежевыжатый сок',            tr: 'Taze Meyve Suyu',      desc: 'Апельсин, яблоко или гранат' },
      { ru: 'Холодный кофе',               tr: 'Soğuk Kahveler',       desc: 'Холодный латте или холодный мокко' }
    ]
  }
];

// ─── RENDER ──────────────────────────────────────────────────────────────────
(function () {
  var root = document.getElementById('menu-root');
  var idCounter = 0;

  MENU.forEach(function (section) {
    var h2 = document.createElement('h2');
    h2.className = 'section-title';
    h2.textContent = section.section_ru;
    root.appendChild(h2);

    section.items.forEach(function (item) {
      idCounter++;
      var id = 'i' + idCounter;

      var div = document.createElement('div');
      div.className = 'item';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = id;
      cb.dataset.pos = String(idCounter).padStart(2, '0');

      var lbl = document.createElement('label');
      lbl.className = 'item-text';
      lbl.htmlFor = id;

      var nameSpan = document.createElement('span');
      nameSpan.className = 'item-name';
      nameSpan.appendChild(document.createTextNode(item.ru + ' '));

      var trSpan = document.createElement('span');
      trSpan.className = 'item-name-tr';
      trSpan.textContent = '(' + item.tr + ')';
      nameSpan.appendChild(trSpan);
      lbl.appendChild(nameSpan);

      if (item.desc) {
        var descSpan = document.createElement('span');
        descSpan.className = 'item-desc';
        descSpan.textContent = item.desc;
        lbl.appendChild(descSpan);
      }

      div.appendChild(cb);
      div.appendChild(lbl);
      root.appendChild(div);
    });
  });
}());

// ─── NAME GATE ───────────────────────────────────────────────────────────────
var nameInput = document.getElementById('guest-name');
var submitBtn = document.getElementById('submit-btn');

nameInput.addEventListener('input', function () {
  submitBtn.disabled = this.value.trim() === '';
});

// ─── SUBMIT ──────────────────────────────────────────────────────────────────
submitBtn.addEventListener('click', function () {
  var name = nameInput.value.trim();
  if (!name) return; // belt-and-suspenders guard

  var checked = [];
  document.querySelectorAll('.item input[type="checkbox"]:checked').forEach(function (cb) {
    var nameEl = cb.closest('.item').querySelector('.item-name');
    if (!nameEl) return;
    var ru = nameEl.childNodes[0].textContent.trim();
    var trEl = nameEl.querySelector('.item-name-tr');
    var tr = trEl ? trEl.textContent.replace(/[()]/g, '').trim() : ru;
    var pos = cb.dataset.pos || '';
    checked.push({ ru: ru, tr: pos + ' ' + tr });
  });

  var btn = this;
  btn.disabled = true;

  var fd = new FormData();
  fd.append('name', name);
  fd.append('selections', checked.map(function (d) { return d.tr; }).join(', ') || '(nothing selected)');

  Promise.resolve({ ok: true })
  .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
  .then(function (res) {
    if (res.ok) {
      showConfirmation(name, checked);
    } else {
      showError('Ошибка при отправке. Попробуйте ещё раз.');
      btn.disabled = false;
    }
  })
  .catch(function () {
    showError('Ошибка соединения. Попробуйте ещё раз.');
    btn.disabled = false;
  });
});

function showError(msg) {
  var el = document.getElementById('form-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function showConfirmation(name, dishes) {
  document.body.innerHTML =
    '<div style="' +
      'min-height:100vh;' +
      'background:#f5f0e8;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'padding:40px 24px;' +
      'font-family:Georgia,serif;' +
      'color:#2c1a0e;' +
      'text-align:center;' +
    '">' +
      '<div style="font-size:2.4rem;margin-bottom:24px;">✓</div>' +
      '<div style="' +
        'font-size:0.7rem;' +
        'font-family:Arial,sans-serif;' +
        'font-weight:700;' +
        'letter-spacing:0.2em;' +
        'text-transform:uppercase;' +
        'color:#8b5e3c;' +
        'margin-bottom:20px;' +
      '">Ваш выбор</div>' +
      (dishes.length
        ? '<ul style="list-style:none;padding:0;margin:0 0 32px;text-align:left;max-width:360px;width:100%;">' +
            dishes.map(function (d) {
              return '<li style="padding:10px 0;border-bottom:1px solid #e0d5c4;">' +
                '<div style="font-size:1rem;font-weight:bold;">' + escHtml(d.ru) + '</div>' +
                '<div style="font-size:0.85rem;color:#7a5c40;font-style:italic;">' + escHtml(d.tr) + '</div>' +
                '</li>';
            }).join('') +
          '</ul>'
        : '<p style="margin-bottom:32px;font-style:italic;color:#7a5c40;">Ничего не выбрано</p>'
      ) +
      '<div style="' +
        'font-size:1.15rem;' +
        'font-weight:bold;' +
        'letter-spacing:0.05em;' +
        'color:#2c1a0e;' +
      '">' + escHtml(name) + '</div>' +
    '</div>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
