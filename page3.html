<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 3</title>
  <link rel="stylesheet" href="buttons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #1a0e06; display: flex; justify-content: center; min-height: 100vh; }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
    }

    /* Stork display area */
    .stork-stage {
      position: relative;
      flex: 0 0 54vh;
      width: calc(100% + 48px);
      margin-left: -24px;
      overflow: hidden;
    }

    .stork-img {
      position: absolute;
      width: 230px;
      height: auto;
    }

    /* Stork 1 – upper left, wobbles */
    .stork1 {
      top: 0;
      left: 0;
      animation: wobble1 4.0s ease-in-out infinite;
    }
    @keyframes wobble1 {
      0%,100% { transform: translate(0px,   0px); }
      30%     { transform: translate(12px, -16px); }
      65%     { transform: translate(-7px,  -9px); }
    }

    /* Stork 2 – right side, mirrored, different phase */
    .stork2 {
      top: 18%;
      right: 0;
      animation: wobble2 5.4s ease-in-out infinite;
    }
    @keyframes wobble2 {
      0%,100% { transform: scaleX(-1) translate(0px,   0px); }
      35%     { transform: scaleX(-1) translate(10px, -18px); }
      70%     { transform: scaleX(-1) translate(-9px, -11px); }
    }

    /* Stork 3 – lower left, slower phase */
    .stork3 {
      top: 38%;
      left: 0;
      animation: wobble3 3.7s ease-in-out infinite;
    }
    @keyframes wobble3 {
      0%,100% { transform: translate(0px,   0px); }
      40%     { transform: translate(9px,  -14px); }
      75%     { transform: translate(-10px, -7px); }
    }

    /* Form rows */
    .form-area {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #2c1810;
    }

    .row-label { white-space: nowrap; }

    .num-field {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      text-align: center;
      border: 1.5px solid rgba(139,26,26,0.7);
      border-radius: 3px;
      background: #f7f3ec;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #2c1810;
      outline: none;
      -moz-appearance: textfield;
    }
    .num-field::-webkit-outer-spin-button,
    .num-field::-webkit-inner-spin-button { -webkit-appearance: none; }

    .name-static { font-weight: 700; }

    .name-field {
      flex: 1;
      height: 42px;
      padding: 0 10px;
      border: 1.5px solid rgba(139,26,26,0.7);
      border-radius: 3px;
      background: #f7f3ec;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      color: #2c1810;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="stork-stage">
      <img class="stork-img stork1" src="assets/storCk1.jpg" alt="">
      <img class="stork-img stork2" src="assets/storCk2.jpg" alt="">
      <img class="stork-img stork3" src="assets/storCk3.jpg" alt="">
    </div>

    <div class="form-area">
      <div class="row">
        <span class="row-label">Аист №</span>
        <input class="num-field" type="number" min="1" max="3">
        <span class="name-static">НИКИТА</span>
      </div>
      <div class="row">
        <span class="row-label">Аист №</span>
        <input class="num-field" type="number" min="1" max="3">
        <input class="name-field" type="text">
      </div>
      <div class="row">
        <span class="row-label">Аист №</span>
        <input class="num-field" type="number" min="1" max="3">
        <input class="name-field" type="text">
      </div>
    </div>

    <nav id="nav">
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename = location.pathname.split('/').pop() || '';
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');

      const match = filename.match(/^page(\d+)\.html$/);
      if (!match) return;

      const n        = parseInt(match[1], 10);
      const prevFile = 'page' + (n - 1) + '.html';
      const nextFile = 'page' + (n + 1) + '.html';

      btnBack.hidden = false;
      btnNext.hidden = false;

      function enableNav(file, btn) {
        fetch(file, { method: 'HEAD' })
          .then(function (r) {
            if (r.ok) {
              btn.disabled = false;
              btn.addEventListener('click', function () { location.href = file; });
            }
          })
          .catch(function () {});
      }

      enableNav(prevFile, btnBack);
      enableNav(nextFile, btnNext);
    }());
  </script>
</body>
</html>
