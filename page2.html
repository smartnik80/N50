<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Dark surround makes the phone frame visible on desktop */
      background: #111827;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 28px 20px 36px;
      gap: 20px;
    }

    .photo-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e5e7eb;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #9ca3af;
    }

    .photo-placeholder svg {
      opacity: 0.6;
    }

    .photo-placeholder span {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .choices {
      background: #f9fafb;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      height: 52px;
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
    }

    #nav {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 18px 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.07em;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:not(:disabled):active {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="photo-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Photo</span>
    </div>

    <div class="choices">
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
    </div>

    <nav id="nav">
      <button id="btn-start" class="btn" hidden>ВПЕРЕД</button>
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename = location.pathname.split('/').pop() || '';

      const btnStart = document.getElementById('btn-start');
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');

      if (filename === 'start.html') {
        btnStart.hidden = false;
        btnStart.addEventListener('click', function () {
          location.href = 'page1.html';
        });
      } else {
        const match = filename.match(/^page(\d+)\.html$/);
        if (!match) return;

        const n        = parseInt(match[1], 10);
        const prevFile = 'page' + (n - 1) + '.html';
        const nextFile = 'page' + (n + 1) + '.html';

        btnBack.hidden = false;
        btnNext.hidden = false;

        function enableIfExists(file, btn) {
          fetch(file, { method: 'HEAD' })
            .then(function (response) {
              if (response.ok) {
                btn.disabled = false;
                btn.addEventListener('click', function () {
                  location.href = file;
                });
              }
            })
            .catch(function () {});
        }

        enableIfExists(prevFile, btnBack);
        enableIfExists(nextFile, btnNext);
      }
    }());
  </script>
</body>
</html>
