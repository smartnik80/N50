<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ваш выбор</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      color: #2c1a0e;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 17px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2c1a0e;
    }

    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #8b5e3c;
      letter-spacing: 0.08em;
    }

    /* ── Choice options ── */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .choice-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #fff;
      border: 2px solid #c9b49a;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .choice-option:hover {
      border-color: #8b5e3c;
    }

    .choice-option.selected {
      border-color: #8b5e3c;
      background: #fdf8f2;
    }

    /* Custom radio button */
    .radio-dot {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: 2px solid #c9b49a;
      border-radius: 50%;
      background: #fff;
      position: relative;
      transition: border-color 0.15s;
    }

    .choice-option.selected .radio-dot {
      border-color: #8b5e3c;
    }

    .radio-dot::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #8b5e3c;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .choice-option.selected .radio-dot::after {
      opacity: 1;
    }

    .choice-label {
      font-size: 1rem;
      color: #2c1a0e;
      user-select: none;
    }

    /* "Other" text input row */
    .choice-option.other-option {
      padding: 10px 16px;
    }

    .other-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: Georgia, serif;
      font-size: 1rem;
      color: #2c1a0e;
      min-width: 0;
    }

    .other-input::placeholder {
      color: #b09a80;
      font-style: italic;
    }

    /* ── Name field ── */
    .name-section {
      border-top: 1px solid #c9b49a;
      padding-top: 24px;
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8b5e3c;
      margin-bottom: 8px;
    }

    .name-input {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: Georgia, serif;
      border: 2px solid #c9b49a;
      border-radius: 6px;
      background: #fff;
      color: #2c1a0e;
      outline: none;
      transition: border-color 0.15s;
    }

    .name-input:focus {
      border-color: #8b5e3c;
    }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2c1a0e;
      color: #f5f0e8;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .submit-btn:hover:not(:disabled),
    .submit-btn:active:not(:disabled) {
      background: #8b5e3c;
    }

    .submit-btn:disabled {
      background: #c9b49a;
      color: #f5f0e8;
      cursor: not-allowed;
    }

    .form-err {
      display: none;
      margin-top: 14px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      color: #8b2020;
    }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <header>
    <h1>Ваш выбор</h1>
    <p>Что вы будете пить?</p>
  </header>

  <div class="choices" id="choices">

    <div class="choice-option" id="opt-white" data-value="Белое вино">
      <div class="radio-dot"></div>
      <span class="choice-label">Белое вино</span>
    </div>

    <div class="choice-option" id="opt-red" data-value="Красное вино">
      <div class="radio-dot"></div>
      <span class="choice-label">Красное вино</span>
    </div>

    <div class="choice-option other-option" id="opt-other">
      <div class="radio-dot"></div>
      <input class="other-input" id="other-input" type="text" placeholder="Другой выбор" autocomplete="off">
    </div>

  </div>

  <div class="name-section">
    <label class="field-label" for="guest-name">ИМЯ</label>
    <input class="name-input" type="text" id="guest-name" autocomplete="given-name">
  </div>

  <button class="submit-btn" id="submit-btn" disabled>ОТПРАВИТЬ</button>
  <p class="form-err" id="form-err"></p>
</div>

<script>
  var options    = document.querySelectorAll('.choice-option');
  var otherOpt   = document.getElementById('opt-other');
  var otherInput = document.getElementById('other-input');
  var nameInput  = document.getElementById('guest-name');
  var submitBtn  = document.getElementById('submit-btn');
  var selected   = null; // currently selected .choice-option element

  function selectOption(el) {
    options.forEach(function (o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    selected = el;
    updateButton();
  }

  function getChoice() {
    if (!selected) return '';
    if (selected === otherOpt) return otherInput.value.trim();
    return selected.dataset.value;
  }

  function updateButton() {
    var hasName   = nameInput.value.trim() !== '';
    var hasChoice = getChoice() !== '';
    submitBtn.disabled = !(hasName && hasChoice);
  }

  // Click on radio options
  document.getElementById('opt-white').addEventListener('click', function () {
    selectOption(this);
    otherInput.value = '';
  });

  document.getElementById('opt-red').addEventListener('click', function () {
    selectOption(this);
    otherInput.value = '';
  });

  // Clicking the "other" row or typing in it selects that option
  otherOpt.addEventListener('click', function () {
    selectOption(otherOpt);
    otherInput.focus();
  });

  otherInput.addEventListener('input', function () {
    selectOption(otherOpt);
    updateButton();
  });

  nameInput.addEventListener('input', updateButton);

  // ── Submit ──────────────────────────────────────────────────────────────────
  submitBtn.addEventListener('click', function () {
    var name   = nameInput.value.trim();
    var choice = getChoice();
    if (!name || !choice) return;

    var btn = this;
    btn.disabled = true;

    var fd = new FormData();
    fd.append('name',   name);
    fd.append('choice', choice);

    Promise.resolve({ ok: true })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (res.ok) {
        showConfirmation(name, choice);
      } else {
        showError('Ошибка при отправке. Попробуйте ещё раз.');
        btn.disabled = false;
      }
    })
    .catch(function () {
      showError('Ошибка соединения. Попробуйте ещё раз.');
      btn.disabled = false;
    });
  });

  function showError(msg) {
    var el = document.getElementById('form-err');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showConfirmation(name, choice) {
    document.body.innerHTML =
      '<div style="' +
        'min-height:100vh;' +
        'background:#f5f0e8;' +
        'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'padding:40px 24px;' +
        'font-family:Georgia,serif;' +
        'color:#2c1a0e;' +
        'text-align:center;' +
      '">' +
        '<div style="font-size:2.4rem;margin-bottom:24px;">✓</div>' +
        '<div style="' +
          'font-size:0.7rem;' +
          'font-family:Arial,sans-serif;' +
          'font-weight:700;' +
          'letter-spacing:0.2em;' +
          'text-transform:uppercase;' +
          'color:#8b5e3c;' +
          'margin-bottom:16px;' +
        '">Ваш выбор</div>' +
        '<div style="font-size:1.1rem;font-weight:bold;margin-bottom:32px;">' + escHtml(choice) + '</div>' +
        '<div style="' +
          'font-size:1.15rem;' +
          'font-weight:bold;' +
          'letter-spacing:0.05em;' +
          'color:#2c1a0e;' +
        '">' + escHtml(name) + '</div>' +
      '</div>';
  }
</script>

</body>
</html>
