<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
      gap: 0;
    }

    .rule {
      border: none;
      border-top: 1px solid #c8bfb0;
      margin: 24px 0;
    }

    .photo-area {
      position: relative;
      width: 100%;
    }

    .photo {
      width: 100%;
      display: block;
      border-radius: 2px;
    }

    /* Overlay covers the right 45% of the image, right-aligned.
       names-list is fixed at 88% of image height (original 80% x 1.1
       for +10% spacing). add-name has no flex-grow so it sits directly
       below the last checkbox. */
    .overlay {
      position: absolute;
      top: 0;
      right: 0;
      width: 45%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .names-list {
      flex: 0 0 88%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 2% 5% 0%;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      background: rgba(237, 232, 223, 0.82);
      padding: 3px 8px 3px 5px;
      border-radius: 3px;
    }

    .name-row input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(139, 26, 26, 0.9);
      border-radius: 2px;
      background: rgba(250, 247, 242, 0.9);
      cursor: pointer;
    }

    .name-row input[type="checkbox"]:checked {
      background: #8b1a1a;
      border-color: #8b1a1a;
    }

    .name-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px;
      top: -1px;
      width: 5px;
      height: 8px;
      border: 2px solid #faf7f2;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .name-text {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #2c1810;
    }

    .add-name {
      padding: 6px 5%;
    }

    .add-name input {
      width: 100%;
      background: rgba(237, 232, 223, 0.88);
      border: none;
      border-bottom: 1.5px solid #8b1a1a;
      padding: 5px 4px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #2c1810;
      outline: none;
    }

    .add-name input::placeholder {
      color: #9a8c82;
      font-style: italic;
    }

    #nav {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 17px 12px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      background: #8b1a1a;
      color: #faf7f2;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:not(:disabled):active { background: #6e1515; }

    .btn:disabled {
      background: #c4b8ae;
      color: #9a8e86;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="photo-area">
      <img class="photo" src="assets/name_select.png" alt="">

      <!-- Form wraps the inputs; submission is handled by JS below -->
      <form id="name-form" class="overlay">

        <div class="names-list">
          <label class="name-row"><input type="checkbox" name="name" value="Павел"><span class="name-text">Павел</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Константин"><span class="name-text">Константин</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Илья"><span class="name-text">Илья</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Дмитрий"><span class="name-text">Дмитрий</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Владимир"><span class="name-text">Владимир</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Виктор"><span class="name-text">Виктор</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Андрей"><span class="name-text">Андрей</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Вадим"><span class="name-text">Вадим</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Никита"><span class="name-text">Никита</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Вячеслав"><span class="name-text">Вячеслав</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Олег"><span class="name-text">Олег</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Саша"><span class="name-text">Саша</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Юрий"><span class="name-text">Юрий</span></label>
        </div>

        <div class="add-name">
          <input type="text" name="custom_name" placeholder="Добавь своё имя">
        </div>

      </form>
    </div>

    <hr class="rule">

    <nav id="nav">
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename = location.pathname.split('/').pop() || '';
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');
      const form     = document.getElementById('name-form');

      const match = filename.match(/^page(\d+)\.html$/);
      if (!match) return;

      const n        = parseInt(match[1], 10);
      const prevFile = 'page' + (n - 1) + '.html';
      const nextFile = 'page' + (n + 1) + '.html';

      btnBack.hidden = false;
      btnNext.hidden = false;

      // НАЗАД: plain navigation, no submission.
      fetch(prevFile, { method: 'HEAD' })
        .then(function (r) {
          if (r.ok) {
            btnBack.disabled = false;
            btnBack.addEventListener('click', function () { location.href = prevFile; });
          }
        })
        .catch(function () {});

      // ВПЕРЕД: POST form data to FormSpree, then navigate.
      // Navigation happens whether FormSpree succeeds or fails so the
      // user is never stuck on this page.
      fetch(nextFile, { method: 'HEAD' })
        .then(function (r) {
          if (r.ok) {
            btnNext.disabled = false;
            btnNext.addEventListener('click', function () {
              btnNext.disabled = true;
              fetch('https://formspree.io/f/meevgjbz', {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
              })
              .finally(function () {
                location.href = nextFile;
              });
            });
          }
        })
        .catch(function () {});
    }());
  </script>
</body>
</html>
