<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Dark surround makes the phone frame visible on desktop */
      background: #111827;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Phone frame ────────────────────────────────────────────────
       Width is derived from viewport height to keep a 9:16 portrait
       ratio, capped at 430 px and never wider than the screen.
       min-height: 100vh fills the visible area; extra content just
       extends the document and scrolls normally – nothing is fixed.
    ──────────────────────────────────────────────────────────────── */
    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 28px 20px 36px;
      gap: 20px;
    }

    /* ── Photo placeholder ──────────────────────────────────────────
       Replace with an <img> or a div with background-image.
       The aspect-ratio keeps the block proportional regardless of width.
    ──────────────────────────────────────────────────────────────── */
    .photo-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #e5e7eb;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #9ca3af;
    }

    .photo-placeholder svg {
      opacity: 0.6;
    }

    .photo-placeholder span {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Multiple-choice placeholder ────────────────────────────────
       Add or remove .choice elements freely.
       Replace each .choice with a real answer button or label.
    ──────────────────────────────────────────────────────────────── */
    .choices {
      background: #f9fafb;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice {
      height: 52px;
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
    }

    /* ── Navigation ─────────────────────────────────────────────────
       margin-top: auto pushes nav to the bottom of .page without any
       fixed or sticky positioning – the page scrolls naturally.
    ──────────────────────────────────────────────────────────────── */
    #nav {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 18px 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.07em;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:not(:disabled):active {
      background: #1d4ed8;
    }

    /* Disabled buttons are dimmed and absorb no pointer events */
    .btn:disabled {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ── Photo placeholder ────────────────────────────────────── -->
    <div class="photo-placeholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
           stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Photo</span>
    </div>

    <!-- ── Multiple-choice placeholder ─────────────────────────── -->
    <!-- Duplicate or remove .choice blocks as needed -->
    <div class="choices">
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
      <div class="choice"></div>
    </div>

    <!-- ── Navigation ───────────────────────────────────────────── -->
    <!-- All buttons are hidden on load; JS reveals the correct ones. -->
    <nav id="nav">
      <!-- Shown only on start.html -->
      <button id="btn-start" class="btn" hidden>ВПЕРЕД</button>

      <!-- Shown on pageN.html; both start disabled until fetch confirms
           the target file exists -->
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    /* ── Navigation logic ──────────────────────────────────────────
       This single file serves as the template for start.html and all
       pageN.html pages.  On each load the script:
         1. Reads the filename from the URL.
         2. Shows the appropriate button(s).
         3. For numbered pages, uses fetch() with method HEAD to check
            whether the neighbouring files actually exist before enabling
            the corresponding button.  A 404 (or any non-ok response)
            leaves the button disabled.  This means page1.html will have
            НАЗАД disabled whenever page0.html is absent – no special
            casing is needed.

       Note: fetch() requires an HTTP server.  It will not work when
       opening files directly via the file:// protocol.
    ────────────────────────────────────────────────────────────── */
    (function () {
      // Grab only the filename part of the URL path.
      const filename = location.pathname.split('/').pop() || '';

      const btnStart = document.getElementById('btn-start');
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');

      if (filename === 'start.html') {

        // ── start.html ────────────────────────────────────────────
        // One button, always enabled, always targets page1.html.
        btnStart.hidden = false;
        btnStart.addEventListener('click', function () {
          location.href = 'page1.html';
        });

      } else {

        // ── pageN.html ────────────────────────────────────────────
        // Extract the integer N from the filename.
        const match = filename.match(/^page(\d+)\.html$/);
        if (!match) return; // unrecognised filename – show nothing

        const n        = parseInt(match[1], 10);
        const prevFile = 'page' + (n - 1) + '.html';
        const nextFile = 'page' + (n + 1) + '.html';

        // Reveal both buttons (still disabled until checks below pass).
        btnBack.hidden = false;
        btnNext.hidden = false;

        // Send a HEAD request for `file`.  If the server responds with
        // 200 OK, enable `btn` and wire up its click handler.
        function enableIfExists(file, btn) {
          fetch(file, { method: 'HEAD' })
            .then(function (response) {
              if (response.ok) {
                btn.disabled = false;
                btn.addEventListener('click', function () {
                  location.href = file;
                });
              }
              // Non-ok (e.g. 404) → button stays disabled.
            })
            .catch(function () {
              // Network error or CORS issue → button stays disabled.
            });
        }

        enableIfExists(prevFile, btnBack);
        enableIfExists(nextFile, btnNext);

      }
    }());
  </script>
</body>
</html>
