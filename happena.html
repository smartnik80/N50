<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Меню — Happena Cappadocia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      color: #2c1a0e;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 17px;
      line-height: 1.55;
      padding: 0 0 40px;
    }

    header {
      background: #2c1a0e;
      color: #f5f0e8;
      text-align: center;
      padding: 28px 20px 22px;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.7;
      letter-spacing: 0.08em;
    }

    .section {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .section-title {
      margin-top: 36px;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8b5e3c;
      border-bottom: 1px solid #c9b49a;
      padding-bottom: 8px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #e0d5c4;
    }

    .item:last-child {
      border-bottom: none;
    }

    /* Custom checkbox */
    .item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      margin-top: 2px;
      border: 2px solid #8b5e3c;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    .item input[type="checkbox"]:checked {
      background: #8b5e3c;
      border-color: #6b4428;
    }

    .item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 9px;
      height: 15px;
      border: 3px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(42deg);
    }

    .item-text {
      flex: 1;
    }

    .item-name {
      font-size: 1rem;
      font-weight: bold;
      color: #2c1a0e;
    }

    .item-name-tr {
      font-weight: normal;
      color: #7a5c40;
      font-size: 0.93rem;
    }

    .item-desc {
      display: block;
      margin-top: 3px;
      font-style: italic;
      font-size: 0.88rem;
      color: #5a4030;
      line-height: 1.45;
    }

    /* Footer form */
    .footer-form {
      max-width: 680px;
      margin: 44px auto 0;
      padding: 28px 16px 10px;
      border-top: 2px solid #c9b49a;
    }

    .footer-form label {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8b5e3c;
      margin-bottom: 8px;
    }

    .footer-form input[type="text"] {
      display: block;
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: Georgia, serif;
      border: 2px solid #c9b49a;
      border-radius: 6px;
      background: #fff;
      color: #2c1a0e;
      outline: none;
      transition: border-color 0.15s;
    }

    .footer-form input[type="text"]:focus {
      border-color: #8b5e3c;
    }

    .footer-form button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      background: #2c1a0e;
      color: #f5f0e8;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .footer-form button:hover:not(:disabled),
    .footer-form button:active:not(:disabled) {
      background: #8b5e3c;
    }

    .footer-form button:disabled {
      background: #c9b49a;
      color: #f5f0e8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<header>
  <h1>Happena Cappadocia</h1>
  <p>Гёреме — Ужин 14 мая</p>
</header>

<div id="menu-root" class="section"></div>

<div class="footer-form section">
  <label for="guest-name">ИМЯ</label>
  <input type="text" id="guest-name" name="guest-name" autocomplete="given-name">
  <button type="button" id="submit-btn" disabled>ОТПРАВИТЬ</button>
  <p id="form-err" style="display:none;margin-top:14px;text-align:center;font-family:Arial,sans-serif;font-size:0.9rem;color:#8b2020;"></p>
</div>

<script>
// ─── MENU DATA ──────────────────────────────────────────────────────────────
var MENU = [
  {
    section_ru: 'Холодные закуски',
    items: [
      { ru: 'Суп дня',                    tr: 'Günün Çorbası' },
      { ru: 'Хайдари',                     tr: 'Haydari',                   desc: 'Йогуртовый дип с сушёной мятой, сливочным маслом, брынзой и острым соусом' },
      { ru: 'Хумус',                       tr: 'Humus',                     desc: 'Пюре из нута с тахини, чесноком и специями' },
      { ru: 'Баклажан-сёгюш',              tr: 'Patlıcan Söğüş',            desc: 'Запечённые на углях баклажаны с петрушкой, мятой, помидорами, луком и чесноком' },
      { ru: 'Имам баялды',                 tr: 'İmam Bayıldı',              desc: 'Баклажаны, фаршированные помидорами, луком, кедровыми орешками и пряностями' },
      { ru: 'Фасоль в оливковом масле',    tr: 'Zeytinyağlı Fasulye',       desc: 'Стручковая фасоль с луком, чесноком, лимоном и помидорами, подаётся холодной' },
      { ru: 'Ассорти мезе',                tr: 'Karışık Meze Tabağı',       desc: 'Имам баялды, табуле, хумус, баклажанный салат и острый хайдари' },
      { ru: 'Сардины в рассоле',           tr: 'Salamura Sardalya',         desc: 'С зеленью, лимоном и помидорами' }
    ]
  },
  {
    section_ru: 'Салаты',
    items: [
      { ru: 'Пастуший салат',   tr: 'Çoban Salata',       desc: 'Помидоры, лук, огурцы, оливковое масло, лимон, грецкий орех' },
      { ru: 'Салат шефа',       tr: 'Şef\'in Salatası',   desc: 'Сезонная зелень, свёкла, горошек, красный лук, сухарики, лимон' },
      { ru: 'Куриный салат',    tr: 'Tavuklu Salata',     desc: 'Курица-гриль, сезонная зелень, пармезан, гранатовая патока, лимонная заправка' },
      { ru: 'Сезонный салат',   tr: 'Mevsim Salata',      desc: 'Краснокочанная капуста, морковь, сезонная зелень и овощи' },
      { ru: 'Табуле',           tr: 'Tabule Salatası',    desc: 'Мелко рубленая петрушка, мята, лук, булгур и помидоры' }
    ]
  },
  {
    section_ru: 'Горячие закуски',
    items: [
      { ru: 'Охотничий пирог',                  tr: 'Avcı Böreği',              desc: 'Блинчики с фаршем из телятины, горошком, луком и чесноком; подаются с зеленью' },
      { ru: 'Вёшенки на гриле',                 tr: 'Izgara İstiridye Mantar',  desc: 'С тимьяном, красным перцем и сливочным маслом' },
      { ru: 'Ичли кёфте',                       tr: 'İçli Köfte',               desc: 'Котлеты в оболочке из булгура с начинкой из фарша телятины и лука; подаются с йогуртом' },
      { ru: 'Хумус с пастырмой',                tr: 'Pastırmalı Humus',         desc: 'Тёплый хумус с тахини и специями, сверху пастырма — вяленая говядина в обмазке из специй' },
      { ru: 'Долма из виноградных листьев',     tr: 'Zeytinyağlı Yaprak Sarma', desc: 'Виноградные листья, фаршированные булгуром и рисом, с йогуртом и томатной пастой' },
      { ru: 'Кокореч в лаваше',                 tr: 'Kokoreç Dürüm',            desc: 'Жаренные на гриле бараньи потрошки со специями, завёрнутые в лаваш с луком' },
      { ru: 'Каппадокийская картошка фри',      tr: 'Patates Tava',             desc: 'С приправой каджун' }
    ]
  },
  {
    section_ru: 'Древние блюда',
    items: [
      { ru: 'Эсри',            tr: 'Esri',           desc: 'Рубленая телятина с курдючным жиром, булгурный плов, гранатовый соус, исот' },
      { ru: 'Вестара',         tr: 'Westara',        desc: 'Бараньи печёночные ломтики в мучной панировке, обжаренные на сковороде' },
      { ru: 'Нохутлу яхни',   tr: 'Nohutlu Yahni',  desc: 'Баранина на кости, тушёная с нутом и томатной пастой; булгурный плов и домашние соленья' },
      { ru: 'Тирит',           tr: 'Tirit',          desc: 'Тушёная баранья шея на кости на лепёшке-пиде, пропитанной мясным соком; домашние соленья' },
      { ru: 'Перепел в печи',  tr: 'Fırında Bıldırcın', desc: 'Перепел с пшенично-булгурным пловом, конопляными семенами и луком-шалот' },
      { ru: 'Хаппена',         tr: 'Happena',        desc: 'Шашлык из ягнёнка с соусом из сливочного и оливкового масла, винограда, мёда и имбиря' },
      { ru: 'Хаттуша-кебаб',  tr: 'Hattusha Kebap', desc: 'Бараньи семенники на шампуре с овощами на углях' }
    ]
  },
  {
    section_ru: 'Каппадокийские блюда',
    items: [
      { ru: 'Тести-кебаб',              tr: 'Testi Kebabı',       desc: 'Кебаб медленного томления с помидорами, перцем, луком и чесноком в запечатанном глиняном кувшине; подаётся с пловом. Возможен куриный вариант' },
      { ru: 'Каппадокийские манты',     tr: 'Kapadokya Mantısı',  desc: 'Домашние пельмени с говядиной; чесночный йогурт и острый соус из перца' },
      { ru: 'Эриште',                   tr: 'Erişte',             desc: 'Домашняя обжаренная пшеничная лапша со сливочным маслом, сыром тулум и тыквенными семечками' },
      { ru: 'Сёмга в кунжуте',          tr: 'Susamlı Somon',      desc: 'Сёмга в кунжутной панировке, обжаренная во фритюре, с сезонными овощами' },
      { ru: 'Кёфте на черепице',        tr: 'Kiremitte Köfte',    desc: 'Котлеты с сезонными овощами в томатном соусе под кашаром; гарнир — картофельное пюре' }
    ]
  },
  {
    section_ru: 'Десерты',
    items: [
      { ru: 'Сушёный инжир и курага',         tr: 'Kuru İncir ve Kayısı Tatlısı',    desc: 'Местный инжир и курага, томлённые в виноградной патоке' },
      { ru: 'Тыквенный десерт с пишмание',    tr: 'Pişmaniyeli Çıtır Kabak Tatlısı', desc: 'Засахаренная тыква в виноградной патоке с турецкой сахарной «ватой»' },
      { ru: 'Пахлава',                         tr: 'Baklava',                          desc: 'Домашняя пахлава с густыми турецкими сливками каймак' },
      { ru: 'Мороженое',                       tr: 'Dondurma',                         desc: 'Шоколадное и ванильное' }
    ]
  }
];

// ─── RENDER ─────────────────────────────────────────────────────────────────
(function () {
  var root = document.getElementById('menu-root');
  var idCounter = 0;

  MENU.forEach(function (section) {
    var h2 = document.createElement('h2');
    h2.className = 'section-title';
    h2.textContent = section.section_ru;
    root.appendChild(h2);

    section.items.forEach(function (item) {
      idCounter++;
      var id = 'i' + idCounter;

      var div = document.createElement('div');
      div.className = 'item';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = id;
      cb.dataset.pos = String(idCounter).padStart(2, '0');

      var lbl = document.createElement('label');
      lbl.className = 'item-text';
      lbl.htmlFor = id;

      var nameSpan = document.createElement('span');
      nameSpan.className = 'item-name';
      nameSpan.appendChild(document.createTextNode(item.ru + ' '));

      var trSpan = document.createElement('span');
      trSpan.className = 'item-name-tr';
      trSpan.textContent = '(' + item.tr + ')';
      nameSpan.appendChild(trSpan);
      lbl.appendChild(nameSpan);

      if (item.desc) {
        var descSpan = document.createElement('span');
        descSpan.className = 'item-desc';
        descSpan.textContent = item.desc;
        lbl.appendChild(descSpan);
      }

      div.appendChild(cb);
      div.appendChild(lbl);
      root.appendChild(div);
    });
  });
}());

// ─── NAME GATE ───────────────────────────────────────────────────────────────
var nameInput = document.getElementById('guest-name');
var submitBtn = document.getElementById('submit-btn');

nameInput.addEventListener('input', function () {
  submitBtn.disabled = this.value.trim() === '';
});

// ─── SUBMIT ──────────────────────────────────────────────────────────────────
submitBtn.addEventListener('click', function () {
  var name = nameInput.value.trim();
  if (!name) return; // belt-and-suspenders guard

  var checked = [];
  document.querySelectorAll('.item input[type="checkbox"]:checked').forEach(function (cb) {
    var nameEl = cb.closest('.item').querySelector('.item-name');
    if (!nameEl) return;
    var ru = nameEl.childNodes[0].textContent.trim();
    var trEl = nameEl.querySelector('.item-name-tr');
    var tr = trEl ? trEl.textContent.replace(/[()]/g, '').trim() : ru;
    var pos = cb.dataset.pos || '';
    checked.push({ ru: ru, tr: pos + ' ' + tr });
  });

  var btn = this;
  btn.disabled = true;

  var fd = new FormData();
  fd.append('name', name);
  fd.append('selections', checked.map(function (d) { return d.tr; }).join(', ') || '(nothing selected)');

  Promise.resolve({ ok: true })
  .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
  .then(function (res) {
    if (res.ok) {
      showConfirmation(name, checked);
    } else {
      showError('Ошибка при отправке. Попробуйте ещё раз.');
      btn.disabled = false;
    }
  })
  .catch(function () {
    showError('Ошибка соединения. Попробуйте ещё раз.');
    btn.disabled = false;
  });
});

function showError(msg) {
  var el = document.getElementById('form-err');
  el.textContent = msg;
  el.style.display = 'block';
}

function showConfirmation(name, dishes) {
  document.body.innerHTML =
    '<div style="' +
      'min-height:100vh;' +
      'background:#f5f0e8;' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
      'padding:40px 24px;' +
      'font-family:Georgia,serif;' +
      'color:#2c1a0e;' +
      'text-align:center;' +
    '">' +
      '<div style="font-size:2.4rem;margin-bottom:24px;">✓</div>' +
      '<div style="' +
        'font-size:0.7rem;' +
        'font-family:Arial,sans-serif;' +
        'font-weight:700;' +
        'letter-spacing:0.2em;' +
        'text-transform:uppercase;' +
        'color:#8b5e3c;' +
        'margin-bottom:20px;' +
      '">Ваш выбор</div>' +
      (dishes.length
        ? '<ul style="list-style:none;padding:0;margin:0 0 32px;text-align:left;max-width:360px;width:100%;">' +
            dishes.map(function (d) {
              return '<li style="padding:10px 0;border-bottom:1px solid #e0d5c4;">' +
                '<div style="font-size:1rem;font-weight:bold;">' + escHtml(d.ru) + '</div>' +
                '<div style="font-size:0.85rem;color:#7a5c40;font-style:italic;">' + escHtml(d.tr) + '</div>' +
                '</li>';
            }).join('') +
          '</ul>'
        : '<p style="margin-bottom:32px;font-style:italic;color:#7a5c40;">Ничего не выбрано</p>'
      ) +
      '<div style="' +
        'font-size:1.15rem;' +
        'font-weight:bold;' +
        'letter-spacing:0.05em;' +
        'color:#2c1a0e;' +
      '">' + escHtml(name) + '</div>' +
    '</div>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
