<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Guess Who</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Photo section ─────────────────────────── */
    #photo-section {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #000;
    }

    #photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.5s ease;
    }

    #photo-img.fade { opacity: 0; }

    #progress {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 12px;
      pointer-events: none;
    }

    .badge {
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.35);
      padding: 3px 11px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.4px;
      transition: all 0.4s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .badge.found {
      background: rgba(255,200,0,0.88);
      color: #000;
      font-weight: 600;
      border-color: rgba(255,200,0,0.4);
    }

    /* ── Belt section ──────────────────────────── */
    #belt-section {
      height: 136px;
      background: #141414;
      position: relative;
      overflow: hidden;
      cursor: grab;
      flex-shrink: 0;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
    }

    #belt-section:active { cursor: grabbing; }

    /* Selection zone indicator */
    #zone {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 96px;
      height: 96px;
      border-radius: 14px;
      border: 2px solid rgba(255,200,0,0.55);
      pointer-events: none;
      z-index: 20;
      animation: zone-pulse 2.4s ease-in-out infinite;
    }

    @keyframes zone-pulse {
      0%, 100% {
        border-color: rgba(255,200,0,0.35);
        box-shadow: 0 0 0 rgba(255,200,0,0);
      }
      50% {
        border-color: rgba(255,200,0,0.9);
        box-shadow: 0 0 18px rgba(255,200,0,0.18);
      }
    }

    /* Face stickers */
    .face {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 90px;
      height: 90px;
      border-radius: 11px;
      overflow: hidden;
      will-change: left;
      user-select: none;
      -webkit-user-select: none;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .face.central {
      transform: translateY(-50%) scale(1.1);
      z-index: 10;
      box-shadow: 0 0 0 2px rgba(255,200,0,0.6);
    }

    @keyframes wobble {
      0%   { transform: translateY(-50%) scale(1.1) rotate(0deg); }
      10%  { transform: translateY(-50%) scale(1.24) rotate(-10deg); }
      22%  { transform: translateY(-50%) scale(1.24) rotate(10deg); }
      34%  { transform: translateY(-50%) scale(1.19) rotate(-7deg); }
      46%  { transform: translateY(-50%) scale(1.19) rotate(7deg); }
      58%  { transform: translateY(-50%) scale(1.14) rotate(-4deg); }
      70%  { transform: translateY(-50%) scale(1.14) rotate(4deg); }
      84%  { transform: translateY(-50%) scale(1.11) rotate(-1deg); }
      100% { transform: translateY(-50%) scale(1.1) rotate(0deg); }
    }

    .face.wobble {
      animation: wobble 0.85s cubic-bezier(.36,.07,.19,.97) both;
      z-index: 15;
    }

    @keyframes zoom-out {
      0%   { transform: translateY(-50%) scale(1.1); opacity: 1; }
      60%  { transform: translateY(-50%) scale(0.3); opacity: 0.5; }
      100% { transform: translateY(-50%) scale(0); opacity: 0; }
    }

    .face.removing {
      animation: zoom-out 0.38s ease-in forwards;
      z-index: 15;
    }

    /* ── Navigation ────────────────────────────── */
    #nav {
      height: 50px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-arrow {
      flex: 1;
      height: 36px;
      background: #1c1c1c;
      border: none;
      border-radius: 7px;
      color: #bbb;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      outline: none;
    }

    .nav-arrow:not(:disabled):active { background: #2c2c2c; color: #fff; }
    .nav-arrow:disabled { opacity: 0.22; cursor: default; }

    #counter {
      font-size: 12px;
      color: #484848;
      min-width: 52px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="photo-section">
  <img id="photo-img" alt="">
  <div id="progress"></div>
</div>

<div id="belt-section">
  <div id="zone"></div>
</div>

<nav id="nav">
  <button class="nav-arrow" id="btn-prev">&#8592;</button>
  <span id="counter"></span>
  <button class="nav-arrow" id="btn-next">&#8594;</button>
</nav>

<script>
const PHOTO_BASE = 'assets/guesswho/';
const GUEST_BASE = 'assets/guests/';

const PHOTOS = [
  'baigouzov_ivanov_kolosov',
  'brilev_koksharov',
  'brilev_koryakin',
  'dikov_tamuza_esinevich',
  'inkin_kolosov_ivanov_kuzmin',
  'ivanov_bavin',
  'ivanov_dikov',
  'ivanov_ivanova_kolosova',
  'ivanov_marinin',
  'ivanova_kuzina',
  'koksharov',
  'koksharov_kolosov_ivanov_sukhotsky',
  'kolosov_esinevich',
  'kuzina_ivanova',
  'kuznetsov_esinevich_kolosov',
  'skorodumov_ogay_kuznetsov',
  'sukhotsky_esinevich_ivanov_kolosov_kuznetsov_ogay',
];

const ALL_GUESTS = [
  'baigouzov','bavin','brilev','chernishova','dikov',
  'esinevich','feshin','inkin','ivanov','ivanova',
  'koksharov','kolosova','koryakin','kuzina','kuzmin',
  'kuznetsov','marinin','ogay','platon','sharipov',
  'skorodumov','sukhotsky','tamuza','tamuzs',
];

// Belt constants
const FACE_W = 90;
const GAP = 16;
const STRIDE = FACE_W + GAP;
const BASE_SPEED = 0.55;
const MAX_SPEED = 7;

// ─── State ───────────────────────────────────────
let photoIdx = 0;
let targetNames = [];
let foundNames = new Set();
let removedGuests = new Set();
let photoRevealed = false;

// Belt
let positions = [];   // [{name, x}]
let faceElMap = {};   // name → element
let speed = BASE_SPEED;
let beltWidth = 0;
let centralName = null;

// Interaction
let isTouching = false;
let touchStartX = 0;
let touchLastX = 0;
let touchMoved = false;

// ─── Boot ────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  beltWidth = document.getElementById('belt-section').offsetWidth || window.innerWidth;
  loadPhoto(0);
  buildBelt();
  startLoop();
  bindEvents();
  updateNav();
});

window.addEventListener('resize', () => {
  beltWidth = document.getElementById('belt-section').offsetWidth || window.innerWidth;
});

// ─── Photo ───────────────────────────────────────
function loadPhoto(idx) {
  photoIdx = idx;
  const base = PHOTOS[idx];
  targetNames = base.split('_');
  foundNames.clear();
  photoRevealed = false;

  const img = document.getElementById('photo-img');
  img.classList.add('fade');
  setTimeout(() => {
    img.src = PHOTO_BASE + base + '01.jpg';
    img.classList.remove('fade');
  }, 280);

  renderBadges();
  document.getElementById('counter').textContent = `${idx + 1} / ${PHOTOS.length}`;
}

function renderBadges() {
  const el = document.getElementById('progress');
  el.innerHTML = '';
  targetNames.forEach(name => {
    const b = document.createElement('div');
    b.className = 'badge' + (foundNames.has(name) ? ' found' : '');
    b.id = 'badge-' + name;
    b.textContent = name;
    el.appendChild(b);
  });
}

function revealPhoto() {
  const img = document.getElementById('photo-img');
  img.classList.add('fade');
  setTimeout(() => {
    img.src = PHOTO_BASE + PHOTOS[photoIdx] + '02.jpg';
    img.classList.remove('fade');
  }, 380);
}

// ─── Belt ────────────────────────────────────────
function buildBelt() {
  // Clear existing
  Object.values(faceElMap).forEach(el => el.remove());
  faceElMap = {};
  positions = [];

  const belt = document.getElementById('belt-section');
  const active = ALL_GUESTS.filter(g => !removedGuests.has(g));
  if (!active.length) return;

  active.forEach((name, i) => {
    const el = document.createElement('div');
    el.className = 'face';
    const img = document.createElement('img');
    img.src = GUEST_BASE + name + '.jpg';
    el.appendChild(img);
    belt.appendChild(el);
    faceElMap[name] = el;
    positions.push({ name, x: i * STRIDE });
  });
}

function stepBelt() {
  const n = positions.length;
  if (!n) return;

  const loopWidth = n * STRIDE;
  const cx = beltWidth / 2 - FACE_W / 2;

  let minDist = Infinity;
  let nextCentral = null;

  positions.forEach(p => {
    p.x += speed;
    // Wrap
    if (p.x > beltWidth + FACE_W + GAP) p.x -= loopWidth;
    if (p.x < -FACE_W - GAP) p.x += loopWidth;

    const el = faceElMap[p.name];
    if (!el || el.classList.contains('removing')) return;

    const dist = Math.abs(p.x - cx);
    if (dist < minDist) { minDist = dist; nextCentral = p.name; }
  });

  centralName = nextCentral;

  // Update DOM
  positions.forEach(p => {
    const el = faceElMap[p.name];
    if (!el) return;
    el.style.left = p.x + 'px';
    const isCenter = p.name === centralName;
    if (isCenter && !el.classList.contains('removing') && !el.classList.contains('wobble')) {
      el.classList.add('central');
    } else if (!isCenter) {
      el.classList.remove('central');
    }
  });
}

function startLoop() {
  (function loop() {
    stepBelt();
    if (!isTouching) {
      // Ease back toward base speed
      speed += (BASE_SPEED - speed) * 0.028;
    }
    requestAnimationFrame(loop);
  })();
}

// ─── Identification ──────────────────────────────
function identify() {
  if (!centralName) return;
  if (foundNames.has(centralName)) return;

  const el = faceElMap[centralName];
  if (!el || el.classList.contains('removing') || el.classList.contains('wobble')) return;

  const matched = targetNames.includes(centralName);

  if (matched) {
    foundNames.add(centralName);

    el.classList.add('wobble');
    el.addEventListener('animationend', () => el.classList.remove('wobble'), { once: true });

    const badge = document.getElementById('badge-' + centralName);
    if (badge) badge.classList.add('found');

    // Check completion
    const allFound = targetNames.every(n => foundNames.has(n));
    if (allFound && !photoRevealed) {
      photoRevealed = true;
      setTimeout(revealPhoto, 700);
    }
  } else {
    // Remove from belt
    removedGuests.add(centralName);
    el.classList.remove('central');
    el.classList.add('removing');
    const gone = centralName;
    setTimeout(() => {
      const e = faceElMap[gone];
      if (e) e.remove();
      delete faceElMap[gone];
      positions = positions.filter(p => p.name !== gone);
    }, 420);
  }
}

// ─── Navigation ──────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= PHOTOS.length) return;
  // Reset per-photo game state (keep removed guests across photos)
  removedGuests.clear();
  buildBelt();
  loadPhoto(idx);
  updateNav();
}

function updateNav() {
  document.getElementById('btn-prev').disabled = photoIdx === 0;
  document.getElementById('btn-next').disabled = photoIdx === PHOTOS.length - 1;
}

// ─── Events ──────────────────────────────────────
function bindEvents() {
  const belt = document.getElementById('belt-section');

  // Touch
  belt.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchLastX = t.clientX;
    touchMoved = false;
    isTouching = true;
  }, { passive: false });

  belt.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchLastX;
    if (Math.abs(t.clientX - touchStartX) > 8) touchMoved = true;
    speed = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, speed + dx * 0.09));
    touchLastX = t.clientX;
  }, { passive: false });

  belt.addEventListener('touchend', e => {
    e.preventDefault();
    isTouching = false;
    if (!touchMoved) identify();
  }, { passive: false });

  // Mouse (desktop)
  let mouseDown = false;
  let mouseStartX = 0;
  let mouseLastX = 0;
  let mouseMoved = false;

  belt.addEventListener('mousedown', e => {
    mouseDown = true;
    mouseStartX = e.clientX;
    mouseLastX = e.clientX;
    mouseMoved = false;
    isTouching = true;
  });

  window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const dx = e.clientX - mouseLastX;
    if (Math.abs(e.clientX - mouseStartX) > 5) mouseMoved = true;
    speed = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, speed + dx * 0.09));
    mouseLastX = e.clientX;
  });

  window.addEventListener('mouseup', () => {
    if (!mouseDown) return;
    mouseDown = false;
    isTouching = false;
    if (!mouseMoved) identify();
  });

  // Nav buttons
  document.getElementById('btn-prev').addEventListener('click', () => goTo(photoIdx - 1));
  document.getElementById('btn-next').addEventListener('click', () => goTo(photoIdx + 1));
}
</script>
</body>
</html>
