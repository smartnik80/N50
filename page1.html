<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
      gap: 0;
    }

    .rule {
      border: none;
      border-top: 1px solid #c8bfb0;
      margin: 24px 0;
    }

    /* ── Image + overlay container ────────────────────────────── */
    .photo-area {
      position: relative;
      width: 100%;
    }

    .photo {
      width: 100%;
      display: block;
      border-radius: 2px;
    }

    /* Transparent overlay on the right 50% of the image.
       Flex column: names-list takes the text area height,
       add-name sits in the empty area below.               */
    .overlay {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Names checklist ──────────────────────────────────────── */
    /* flex: 4 / flex: 1 = 80 % / 20 % split.
       Adjust if the empty area in your image is taller or shorter. */
    .names-list {
      flex: 4;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 2% 5% 1%;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* Custom checkbox */
    .name-row input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      flex-shrink: 0;
      width: 11px;
      height: 11px;
      border: 1.5px solid rgba(139, 26, 26, 0.9);
      border-radius: 2px;
      background: rgba(250, 247, 242, 0.65);
      cursor: pointer;
    }

    .name-row input[type="checkbox"]:checked {
      background: #8b1a1a;
      border-color: #8b1a1a;
    }

    .name-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px;
      top: -1px;
      width: 4px;
      height: 7px;
      border: 1.5px solid #faf7f2;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 9px;
      color: #8b1a1a;
      min-width: 13px;
      text-align: right;
      flex-shrink: 0;
    }

    .name-text {
      font-size: 10px;
      color: #2c1810;
      /* white halo for legibility over the blurred image */
      text-shadow: 0 0 8px rgba(255,255,255,0.95), 0 0 3px rgba(255,255,255,0.8);
      white-space: nowrap;
    }

    /* ── Custom name input ────────────────────────────────────── */
    .add-name {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 3% 5%;
    }

    .add-name input {
      width: 100%;
      background: rgba(237, 232, 223, 0.8);
      border: none;
      border-bottom: 1.5px solid #8b1a1a;
      padding: 4px 3px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 10px;
      color: #2c1810;
      outline: none;
    }

    .add-name input::placeholder {
      color: #9a8c82;
      font-style: italic;
    }

    /* ── Navigation ───────────────────────────────────────────── */
    #nav {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 17px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      background: #8b1a1a;
      color: #faf7f2;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:not(:disabled):active { background: #6e1515; }

    .btn:disabled {
      background: #c4b8ae;
      color: #9a8e86;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ── Photo with overlaid checklist ──────────────────────── -->
    <div class="photo-area">
      <img class="photo" src="assets/name_select.png" alt="">

      <div class="overlay">

        <!-- Names fill the text area of the image (top ~80 %) -->
        <div class="names-list">
          <label class="name-row"><input type="checkbox" name="name" value="Павел"><span class="num">1</span><span class="name-text">Павел</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Константин"><span class="num">2</span><span class="name-text">Константин</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Илья"><span class="num">3</span><span class="name-text">Илья</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Дмитрий"><span class="num">4</span><span class="name-text">Дмитрий</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Владимир"><span class="num">5</span><span class="name-text">Владимир</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Виктор"><span class="num">6</span><span class="name-text">Виктор</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Андрей"><span class="num">7</span><span class="name-text">Андрей</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Вадим"><span class="num">8</span><span class="name-text">Вадим</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Никита"><span class="num">9</span><span class="name-text">Никита</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Вячеслав"><span class="num">10</span><span class="name-text">Вячеслав</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Олег"><span class="num">11</span><span class="name-text">Олег</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Саша"><span class="num">12</span><span class="name-text">Саша</span></label>
          <label class="name-row"><input type="checkbox" name="name" value="Юрий"><span class="num">13</span><span class="name-text">Юрий</span></label>
        </div>

        <!-- Empty bottom area of the image gets a text input -->
        <div class="add-name">
          <input type="text" placeholder="Добавь своё имя">
        </div>

      </div>
    </div>

    <hr class="rule">

    <!-- ── Navigation ─────────────────────────────────────────── -->
    <nav id="nav">
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename = location.pathname.split('/').pop() || '';
      const btnBack  = document.getElementById('btn-back');
      const btnNext  = document.getElementById('btn-next');
      const match = filename.match(/^page(\d+)\.html$/);
      if (!match) return;
      const n        = parseInt(match[1], 10);
      const prevFile = 'page' + (n - 1) + '.html';
      const nextFile = 'page' + (n + 1) + '.html';
      btnBack.hidden = false;
      btnNext.hidden = false;
      function enableIfExists(file, btn) {
        fetch(file, { method: 'HEAD' })
          .then(function (r) {
            if (r.ok) {
              btn.disabled = false;
              btn.addEventListener('click', function () { location.href = file; });
            }
          })
          .catch(function () {});
      }
      enableIfExists(prevFile, btnBack);
      enableIfExists(nextFile, btnNext);
    }());
  </script>
</body>
</html>
