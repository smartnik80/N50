<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #slide {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Fade transition */
    #slide img.fade-out {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #slide img.fade-in {
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    /* Left / right tap zones */
    .zone {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 40%;
      cursor: pointer;
      z-index: 10;
    }

    #zone-prev { left: 0; }
    #zone-next { right: 0; }

    /* Counter badge */
    #counter {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 20;
    }

    /* Arrow hints (subtle) */
    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      z-index: 20;
    }

    #arrow-prev { left: 12px; }
    #arrow-next { right: 12px; }
  </style>
</head>
<body>

  <div id="slide">
    <img id="photo" src="" alt="">
  </div>

  <div id="zone-prev" class="zone"></div>
  <div id="zone-next" class="zone"></div>

  <div id="arrow-prev" class="arrow">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </div>
  <div id="arrow-next" class="arrow">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </div>

  <div id="counter"></div>

  <audio id="click-sound" src="assets/gallery/diapoclick.mp3" preload="auto"></audio>

  <script>
    var photos = [
      'assets/gallery/DSC_0065.JPG',
      'assets/gallery/DSC_0128.JPG',
      'assets/gallery/DSC_0133.JPG',
      'assets/gallery/DSC_0188.JPG',
      'assets/gallery/DSC_0190.JPG',
      'assets/gallery/DSC_0212.JPG',
      'assets/gallery/DSC_0219.jpg',
      'assets/gallery/DSC_0290.JPG',
      'assets/gallery/DSC_0392.jpg',
      'assets/gallery/DSC_0997.JPG',
      'assets/gallery/DSC_4415.JPG',
      'assets/gallery/DSC_4526.JPG'
    ];

    var current  = 0;
    var photo    = document.getElementById('photo');
    var counter  = document.getElementById('counter');
    var sound    = document.getElementById('click-sound');
    var busy     = false;
    var autoTimer = null;

    var AUTO_INTERVAL = 40000;

    function resetTimer() {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(function () { advance(1); }, AUTO_INTERVAL);
    }

    function updateCounter() {
      counter.textContent = (current + 1) + ' / ' + photos.length;
    }

    function show(index, direction) {
      if (busy) return;
      busy = true;

      var next = (index + photos.length) % photos.length;

      // Play sound
      sound.currentTime = 0;
      sound.play().catch(function () {});

      // Fade out
      photo.classList.add('fade-out');
      photo.classList.remove('fade-in');

      setTimeout(function () {
        current = next;
        photo.src = photos[current];
        updateCounter();

        photo.onload = function () {
          photo.classList.remove('fade-out');
          photo.classList.add('fade-in');
          busy = false;
        };

        // Fallback in case onload already fired (cached)
        if (photo.complete) {
          photo.classList.remove('fade-out');
          photo.classList.add('fade-in');
          busy = false;
        }
      }, 250);
    }

    function advance(delta) {
      show(current + delta);
      resetTimer();
    }

    document.getElementById('zone-next').addEventListener('click', function () {
      advance(1);
    });

    document.getElementById('zone-prev').addEventListener('click', function () {
      advance(-1);
    });

    // Keyboard support
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); advance(1); }
      if (e.key === 'ArrowLeft')                   { e.preventDefault(); advance(-1); }
    });

    // Init
    photo.src = photos[current];
    photo.classList.add('fade-in');
    updateCounter();
    resetTimer();
  </script>
</body>
</html>
