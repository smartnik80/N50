<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <link rel="stylesheet" href="buttons.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
      gap: 0;
    }

    .greeting-video {
      display: block;
      width: calc(100% + 48px);
      margin-left: -24px;
      margin-top: -32px;
    }

    #nav {
      margin-top: auto;
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="page">

    <video class="greeting-video" autoplay muted loop playsinline>
      <source src="assets/Video_Background_Color_Changed.mp4" type="video/mp4">
    </video>

    <nav id="nav">
      <button id="btn-start" class="btn">КТО ЗДЕСЬ</button>
    </nav>

  </div>

  <script>
    document.getElementById('btn-start').addEventListener('click', function () {
      location.href = 'page1.html';
    });
  </script>
</body>
</html>
