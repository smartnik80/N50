<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 12</title>
  <link rel="stylesheet" href="buttons.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a0e06;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .page {
      width: min(calc(100vh * 9 / 16), 430px, 100vw);
      min-height: 100vh;
      background: #ede8df;
      display: flex;
      flex-direction: column;
      padding: 0 24px 40px;
    }

    .photo {
      display: block;
      width: calc(100% + 48px);
      margin-left: -24px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .choice-label {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f7f3ec;
      border: 1px solid #c8bfb0;
      border-left: 3px solid #8b1a1a;
      border-radius: 2px;
      padding: 13px 14px;
      cursor: pointer;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #2c1810;
      transition: background 0.1s;
    }

    .choice-label:has(input:checked) {
      background: #f0e8e0;
    }

    .choice-label input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(139, 26, 26, 0.65);
      border-radius: 3px;
      background: rgba(250, 247, 242, 0.9);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      position: relative;
    }

    .choice-label input[type="checkbox"]:checked {
      background-color: #8b1a1a;
      border-color: #8b1a1a;
    }

    .choice-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 5px;
      height: 9px;
      border: 2px solid #faf7f2;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="page">

    <img class="photo" src="assets/victorina/nik_paris.jpg" alt="">

    <form id="answer-form">
      <div class="choices">
        <label class="choice-label">
          <input type="checkbox" name="answer" value="Эйфелева башня">
          Эйфелева башня
        </label>
        <label class="choice-label">
          <input type="checkbox" name="answer" value="Нотр-Дам">
          Нотр-Дам
        </label>
        <label class="choice-label">
          <input type="checkbox" name="answer" value="Лувр">
          Лувр
        </label>
        <label class="choice-label">
          <input type="checkbox" name="answer" value="Версаль">
          Версаль
        </label>
        <label class="choice-label">
          <input type="checkbox" name="answer" value="Мон-Сен-Мишель">
          Мон-Сен-Мишель
        </label>
      </div>
    </form>

    <button id="btn-submit" type="button">ОТПРАВИТЬ</button>

    <nav id="nav">
      <button id="btn-back" class="btn" hidden disabled>НАЗАД</button>
      <button id="btn-next" class="btn" hidden disabled>ВПЕРЕД</button>
    </nav>

  </div>

  <script>
    (function () {
      const filename  = location.pathname.split('/').pop() || '';
      const btnBack   = document.getElementById('btn-back');
      const btnNext   = document.getElementById('btn-next');
      const btnSubmit = document.getElementById('btn-submit');
      const form      = document.getElementById('answer-form');

      const match = filename.match(/^page(\d+)\.html$/);
      if (match) {
        const n        = parseInt(match[1], 10);
        const prevFile = 'page' + (n - 1) + '.html';
        const nextFile = 'page' + (n + 1) + '.html';

        btnBack.hidden = false;
        btnNext.hidden = false;

        if (n > 1) {
          btnBack.disabled = false;
          btnBack.addEventListener('click', function () { location.href = prevFile; });
        }
        if (n < 13) {
          btnNext.disabled = false;
          btnNext.addEventListener('click', function () { location.href = nextFile; });
        }
      }

      btnSubmit.addEventListener('click', function () {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '…';

        Promise.resolve({ ok: true })
        .then(function (r) {
          if (r.ok) {
            btnSubmit.textContent = '✓ ОТПРАВЛЕНО';
          } else {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'ОТПРАВИТЬ';
          }
        })
        .catch(function () {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'ОТПРАВИТЬ';
        });
      });
    }());
  </script>
</body>
</html>
